<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>安衡 · 每日健康计划</title>
  <style>
    :root { --ink:#16382e; --muted:#6b7e77; --paper:#f7f7f1; --card:#fffefa; --line:#dfe7de; --leaf:#216c4d; --mint:#dff1e6; --sun:#f5c96a; --alert:#b4513c; --shadow:0 12px 36px rgba(34,67,49,.08); }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--paper); font-family:ui-rounded, "PingFang SC", "Microsoft YaHei", sans-serif; line-height:1.5; }
    .wrap { max-width:1120px; margin:auto; padding:30px 22px 68px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:28px; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:800; font-size:21px; letter-spacing:.04em; }.mark { width:39px;height:39px;display:grid;place-items:center;background:var(--leaf);color:white;border-radius:14px;font-size:21px; }
    .tag { border:1px solid var(--line); border-radius:999px; padding:7px 12px; color:var(--muted); font-size:13px; white-space:nowrap; }
    .hero { display:grid; grid-template-columns:1.1fr .9fr; gap:28px; align-items:stretch; margin-bottom:26px; }
    .intro { padding:22px 0 10px; }.eyebrow { color:var(--leaf); font-weight:750; font-size:14px; letter-spacing:.08em; }.intro h1 { font-size:clamp(31px,4.2vw,52px); line-height:1.12; margin:11px 0 15px; letter-spacing:-.045em; }.intro p { color:var(--muted); max-width:570px; font-size:16px; }
    .notice { margin-top:22px; padding:12px 15px; border-left:3px solid var(--sun); background:#fff8e8; color:#775924; border-radius:0 12px 12px 0; font-size:13px; }
    .leaf-art { min-height:230px; border-radius:28px; background:linear-gradient(145deg,#dff1e6,#b9dfc7); position:relative; overflow:hidden; box-shadow:var(--shadow); }.leaf-art:before,.leaf-art:after { content:""; position:absolute; background:#55a171; width:200px;height:100px;border-radius:100% 0 100% 0; opacity:.8; }.leaf-art:before { left:-32px;bottom:-15px;transform:rotate(18deg); }.leaf-art:after{right:-50px;top:18px;transform:rotate(-30deg);background:#2c805b;}.art-copy { position:absolute;z-index:1;left:32px;top:30px;font-size:20px;font-weight:800;max-width:180px; }.art-copy small { display:block;color:#397057;font-size:13px;font-weight:600;margin-top:10px; }
    .grid { display:grid; grid-template-columns:360px 1fr; gap:26px; align-items:start; }.panel { background:var(--card); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); }.form { padding:24px; position:sticky; top:18px; }.form h2,.plan h2 { margin:0 0 5px;font-size:20px; }.sub { color:var(--muted); font-size:13px; margin:0 0 19px; }
    label { display:block; font-size:13px; font-weight:700; margin:14px 0 6px; }.row { display:grid;grid-template-columns:1fr 1fr; gap:10px; }.input { position:relative; }.input span { position:absolute;right:11px;top:10px;color:var(--muted);font-size:12px;pointer-events:none; } input,select { width:100%; border:1px solid #cedbd2; background:#fbfcf9; color:var(--ink); border-radius:10px;padding:10px 42px 10px 11px;font:inherit;outline:none; }select { padding-right:10px; }input:focus,select:focus{border-color:var(--leaf);box-shadow:0 0 0 3px #dff1e680;} .measure-title { font-size:12px;font-weight:800;color:var(--leaf);margin-top:18px;text-transform:uppercase;letter-spacing:.08em; }
    button { width:100%; margin-top:21px; border:0;border-radius:12px;padding:13px;background:var(--leaf);color:#fff;font:700 15px inherit;cursor:pointer;transition:.18s; } button:hover { background:#18583e; transform:translateY(-1px); }.save { background:transparent; color:var(--leaf); border:1px solid #b7d3c1; margin-top:9px; padding:9px; font-size:13px; }.save:hover { background:var(--mint);color:var(--leaf); }
    .plan { padding:25px; min-height:600px; }.empty { text-align:center;padding:105px 20px;color:var(--muted); }.empty .circle { width:70px;height:70px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-size:31px;margin:0 auto 17px; }.summary { display:flex;gap:10px;flex-wrap:wrap;margin:20px 0; }.pill { padding:7px 11px;border-radius:999px;background:#eef5ef;font-size:12px;font-weight:700; }.pill.warn { background:#fff1e9;color:var(--alert); }.alert { background:#fff3eb;color:#88402e;padding:12px 14px;border-radius:12px;font-size:13px;margin:0 0 18px; }
    .cards { display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px; }.card { border:1px solid var(--line);border-radius:15px;padding:15px; }.icon { font-size:22px; }.card h3{font-size:14px;margin:7px 0 6px;}.card p{font-size:13px;color:var(--muted);margin:0;}.score { color:var(--leaf);font-weight:800;font-size:17px; }
    .section-title { display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 10px; }.section-title h3{margin:0;font-size:16px;}.section-title span{font-size:12px;color:var(--muted);}.advice { display:grid;grid-template-columns:1fr 1fr;gap:13px; }.advice article { background:#f5f8f3;border-radius:14px;padding:15px; }.advice h4{margin:0 0 7px;font-size:14px;}.advice ul{padding-left:18px;margin:0;color:#456057;font-size:13px;}.advice li+li{margin-top:5px;}
    .week { width:100%;border-collapse:collapse;font-size:13px; }.week th{text-align:left;color:var(--muted);font-size:12px;font-weight:600;padding:9px;border-bottom:1px solid var(--line);}.week td{padding:11px 9px;border-bottom:1px solid #edf1eb;vertical-align:top;}.week tr:last-child td{border:0;}.day{font-weight:800;white-space:nowrap;}.footer { margin-top:16px;color:var(--muted);font-size:12px; }
    @media(max-width:820px){.hero,.grid{grid-template-columns:1fr}.leaf-art{min-height:160px}.form{position:static}.cards{grid-template-columns:1fr}.advice{grid-template-columns:1fr}.wrap{padding:20px 14px 45px}.intro{padding-top:5px}.plan{padding:20px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header><div class="brand"><span class="mark">⌁</span>安衡健康</div><span class="tag">为 40+ 的日常而设计</span></header>
    <section class="hero"><div class="intro"><div class="eyebrow">每天一点，身体会记得</div><h1>把健康数据，变成今天能做到的计划。</h1><p>填写一次基础指标，获得温和、具体的饮食和运动提醒。建议会根据血压、血糖、体重和生活习惯调整。</p><div class="notice">这是一项健康生活辅助工具，不能替代医生诊断或用药建议。若指标明显异常、感觉不适或正在调整药物，请及时咨询医生。</div></div><div class="leaf-art"><div class="art-copy">稳稳向前<small>饮食 · 活动 · 睡眠</small></div></div></section>
    <section class="grid">
      <form class="panel form" id="healthForm">
        <h2>今日身体记录</h2><p class="sub">请输入最近一次测量结果</p>
        <div class="measure-title">血压</div><div class="row"><div><label for="sys">收缩压</label><div class="input"><input id="sys" type="number" min="60" max="250" placeholder="如 125" required><span>mmHg</span></div></div><div><label for="dia">舒张压</label><div class="input"><input id="dia" type="number" min="40" max="160" placeholder="如 80" required><span>mmHg</span></div></div></div>
        <div class="measure-title">血糖</div><label for="glucose">血糖值</label><div class="row"><div class="input"><input id="glucose" type="number" min="1" max="35" step="0.1" placeholder="如 5.6" required><span>mmol/L</span></div><select id="timing" aria-label="测量时点"><option value="fasting">空腹</option><option value="post">餐后 2 小时</option><option value="random">随机</option></select></div>
        <div class="measure-title">体重与生活</div><div class="row"><div><label for="age">年龄</label><div class="input"><input id="age" type="number" min="18" max="110" placeholder="如 52" required><span>岁</span></div></div><div><label for="gender">性别</label><select id="gender" required><option value="female">女</option><option value="male">男</option></select></div></div><div class="row"><div><label for="height">身高</label><div class="input"><input id="height" type="number" min="120" max="230" placeholder="如 165" required><span>cm</span></div></div><div><label for="weight">体重</label><div class="input"><input id="weight" type="number" min="30" max="250" step="0.1" placeholder="如 65" required><span>kg</span></div></div></div><label for="activity">平时活动量</label><select id="activity"><option value="low">久坐，很少规律运动</option><option value="medium">每周运动 1–3 天</option><option value="high">每周运动 4 天或以上</option></select>
        <button type="submit">生成我的健康计划</button><button type="button" class="save" id="save">保存本次数据到此设备</button>
      </form>
      <section class="panel plan" id="result"><div class="empty"><div class="circle">♡</div><strong>从一次记录开始</strong><p>填写左侧数据后，这里会生成你的每日和 7 天建议。</p></div></section>
    </section>
  </main>
  <script>
    const $=id=>document.getElementById(id), form=$('healthForm');
    const dataFields=['sys','dia','glucose','timing','age','gender','height','weight','activity'];
    function ranges(d){ const bp=d.sys>=180||d.dia>=120?'urgent':d.sys>=140||d.dia>=90?'high':d.sys>=130||d.dia>=85?'elevated':'ok'; const gHigh=d.timing==='fasting'?d.glucose>=7:d.timing==='post'?d.glucose>=11.1:d.glucose>=11.1; const gLow=d.glucose<3.9; const bmi=d.weight/((d.height/100)**2); return {bp,gHigh,gLow,bmi}; }
    function advice(d,r){
      let food=['早餐可选玉米面粥 250g、鸡蛋 1 个（约 50g）和凉拌菠菜 100g；少放盐和香油。','午餐可做清蒸鲅鱼或黄花鱼 100g、白菜豆腐 200g、杂粮饭 100g（熟重）。','晚餐建议青岛家常蛤蜊冬瓜汤 250g（蛤蜊肉约 50g）、清炒油麦菜 150g、蒸红薯 100g。','全天烹调油约 20–25g、食盐不超过 5g；海鲜以清蒸、白灼为主，少蘸酱油和虾酱。'];
      let move=['饭后休息片刻后，进行“轻松步行”10–15 分钟。','久坐每 45–60 分钟，做 3–5 分钟原地踏步、伸展肩颈和小腿提踵。','选择快走、骑固定自行车或广场舞等能交谈的中等强度活动。'];
      if(r.gHigh){food.unshift('本餐减少精制主食和甜点，用蔬菜、豆制品、鱼禽肉补足饱腹感。');move[0]='餐后 15–30 分钟，在安全舒适的环境中“慢走”10–15 分钟。';}
      if(r.bmi>=24) food.push('以“七八分饱”为目标，晚餐不额外加夜宵；不追求快速减重。');
      if(d.gender==='female') food.push(d.age>=45?'女性中年期应重视钙和蛋白质：每日可选牛奶或无糖酸奶 300g、北豆腐 100g；如绝经后或有骨质疏松风险，请咨询医生。':'可将一周 1–2 次的红肉安排为瘦牛肉或瘦猪肉 50–75g，并搭配深绿叶菜；经量大、乏力等情况请咨询医生评估铁状态。');
      if(d.gender==='male') food.push('男性更要留意腰围、饮酒和夜宵：晚餐避免啤酒、白酒和烧烤；以无糖茶水或白水替代，腹型肥胖建议结合医生意见管理。');
      if(d.activity==='low') move.push('从每天累计 20 分钟步行开始，可分早晚两次完成；一周后再逐步增加。');
      else move.push('本周安排 2 次轻力量训练：靠墙俯卧撑、椅子坐站和弹力带划船，各 8–12 次，做 1–2 组。');
      if(d.age>=65) move.push('每周至少 3 天练习平衡：扶稳椅背单脚站立或太极基础动作，每次 5–10 分钟；需有人或稳固物体在旁保护。');
      if(r.bp==='high'||r.bp==='urgent') {food.unshift('今天避免高盐外卖、腌菜和重口味汤底；查看包装食品的钠含量。');move.push('血压偏高时不做憋气、冲刺或大重量训练；如有头晕、胸闷请停止活动。');}
      return {food,move};
    }
    function flag(r){if(r.bp==='urgent')return '血压读数很高：若复测仍 ≥180/120，或伴胸痛、气短、神经系统症状，请立即就医。';if(r.gLow)return '血糖偏低：如出现心慌、出汗、颤抖或意识不清，请按医生指导及时处理并寻求医疗帮助。';if(r.gHigh)return '血糖读数偏高：请结合医生给出的个人目标观察，若反复升高或不适，请尽快咨询医生。';if(r.bp==='high')return '血压偏高：安静休息 5 分钟后可复测；连续多天偏高建议就医评估。';return '';}
    function render(d){ const r=ranges(d), a=advice(d,r), bmi=r.bmi.toFixed(1), date=new Date(); const f=flag(r); const blood=r.bp==='ok'?'平稳':r.bp==='elevated'?'需留意':'偏高'; const glucose=r.gHigh?'偏高':r.gLow?'偏低':'在常见范围'; const activities=d.age>=65?['饭后慢走 15 分钟','扶椅背单脚站立 + 小腿提踵 10 分钟','太极基础动作或八段锦 15 分钟','椅子坐站练习 10 分钟','轻松步行 20 分钟','靠墙俯卧撑 + 弹力带划船 15 分钟','舒缓拉伸 + 原地踏步 15 分钟']:['饭后快走 20 分钟','靠墙俯卧撑 + 椅子坐站 15 分钟','骑固定自行车或快走 25 分钟','弹力带划船 + 小腿提踵 15 分钟','饭后快走 25 分钟','广场舞或游泳 30 分钟','舒缓拉伸 + 轻松步行 20 分钟']; const meals=['早：玉米面粥 250g、煮鸡蛋 50g、拌菠菜 100g；午：清蒸鲅鱼 100g、白菜豆腐 200g、杂粮饭 100g（熟重）','早：小米粥 250g、全麦馒头 50g、拌海带丝 80g；午：葱烧海参 50g、芹菜木耳 200g、米饭 100g（熟重）','早：无糖酸奶 200g、蒸红薯 100g；午：萝卜炖牛腱 75g、清炒菜花 200g、杂粮饭 100g（熟重）','早：豆浆 250ml、鸡蛋 50g；午：清蒸黄花鱼 100g、蒜蓉西兰花 200g、玉米 150g','早：燕麦粥 250g、拌黄瓜 100g；午：蛤蜊豆腐汤 250g（蛤蜊肉 50g）、清炒油麦菜 150g、米饭 100g（熟重）','早：牛奶 250ml、全麦面包 50g；午：番茄炖鸡胸 100g、凉拌木耳 150g、红薯 150g','早：杂粮粥 250g、煮鸡蛋 50g；午：清蒸虾仁 80g、冬瓜海带汤 250g、杂粮饭 100g（熟重）']; const week=Array.from({length:7},(_,i)=>{let x=new Date(date);x.setDate(date.getDate()+i);let label=i===0?'今天':`周${'日一二三四五六'[x.getDay()]}`;return `<tr><td class="day">${label}<br><small>${x.getMonth()+1}/${x.getDate()}</small></td><td>${meals[i]}</td><td>${activities[i]}</td></tr>`}).join('');
      $('result').innerHTML=`<h2>你好，今天从小步开始</h2><p class="sub">基于你刚刚输入的指标生成 · ${date.toLocaleDateString('zh-CN')}</p><div class="summary"><span class="pill ${r.bp==='ok'?'':'warn'}">血压：${blood}</span><span class="pill ${r.gHigh||r.gLow?'warn':''}">血糖：${glucose}</span><span class="pill ${r.bmi>=24?'warn':''}">BMI：${bmi}</span></div>${f?`<div class="alert">${f}</div>`:''}<div class="cards"><div class="card"><div class="icon">◌</div><h3>今日活动</h3><div class="score">${d.activity==='low'?'20 分钟起步':'30 分钟舒适活动'}</div><p>能持续，比强度更重要</p></div><div class="card"><div class="icon">⌁</div><h3>盘中蔬菜</h3><div class="score">至少 2 捧</div><p>让它占餐盘的一半</p></div><div class="card"><div class="icon">☾</div><h3>睡前提醒</h3><div class="score">少屏幕 30 分钟</div><p>规律睡眠也关乎血压</p></div></div><div class="advice"><article><h4>🥗 今日饮食</h4><ul>${a.food.map(x=>`<li>${x}</li>`).join('')}</ul></article><article><h4>🚶 今日运动</h4><ul>${a.move.map(x=>`<li>${x}</li>`).join('')}</ul></article></div><div class="section-title"><h3>未来 7 天轻计划</h3><span>可按身体状况灵活调整</span></div><table class="week"><thead><tr><th>日期</th><th>饮食重点</th><th>活动建议</th></tr></thead><tbody>${week}</tbody></table><p class="footer">建议基于一般健康生活原则自动生成，不包含诊断、处方或个体化治疗建议。</p>`;
    }
    form.addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(dataFields.map(k=>[k,$(k).value]));['sys','dia','glucose','age','height','weight'].forEach(k=>d[k]=Number(d[k]));render(d);});
    $('save').addEventListener('click',()=>{const d=Object.fromEntries(dataFields.map(k=>[k,$(k).value]));localStorage.setItem('anhealth-data',JSON.stringify(d));$('save').textContent='已保存到此设备 ✓';setTimeout(()=>$('save').textContent='保存本次数据到此设备',1800);});
    try{const d=JSON.parse(localStorage.getItem('anhealth-data'));if(d) dataFields.forEach(k=>$(k).value=d[k]||'');}catch(e){}
  </script>
</body>
</html>
